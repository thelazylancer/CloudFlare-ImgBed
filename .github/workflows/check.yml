name: Check
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run check
      - run: npx wrangler deploy --dry-run --config deploy/cleanup/wrangler.toml
