name: Upstream Sync

permissions:
  contents: write
  actions: write
  issues: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:
    inputs:
      confirm_breaking_update:
        description: "I have reviewed any compatibility update notice and agree to apply it if present / 我已阅读可能存在的兼容性更新公告，并同意在有此类更新时应用"
        required: true
        default: false
        type: boolean

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Check breaking update policy
        id: breaking_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: MarSeventh/CloudFlare-ImgBed
          UPSTREAM_BRANCH: main
          ALLOW_BREAKING_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_breaking_update == true }}
        run: bash .github/breaking-updates/scripts/breaking-update-guard.sh check

      - name: Sync upstream changes
        id: sync
        if: steps.breaking_guard.outputs.blocked != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit refs/remotes/cloudflare-imgbed-upstream/main

      - name: Set up Node.js
        if: steps.sync.outcome == 'success'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.sync.outcome == 'success'
        run: npm ci --include=dev

      - name: Validate merged changes
        if: steps.sync.outcome == 'success'
        run: |
          npm run check
          npx wrangler deploy --dry-run --config deploy/cleanup/wrangler.toml

      - name: Push validated changes
        id: push
        if: steps.sync.outcome == 'success'
        run: git push origin HEAD:main

      - name: Complete breaking update notices
        if: steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/breaking-updates/scripts/breaking-update-guard.sh complete

      - name: Trigger Worker deploy
        if: steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-worker.yml --repo "${{ github.repository }}" --ref main

      - name: Sync failure guidance
        if: failure() && steps.breaking_guard.outputs.blocked != 'true'
        run: |
          {
            echo "## ⚠️ 上游同步未完成 / Upstream synchronization did not complete"
            echo
            echo "请查看失败步骤：Sync upstream changes 中的 CONFLICT 表示上游与本 Fork 的定制功能存在合并冲突；Validate merged changes 失败表示合并后检查未通过；Push validated changes 失败则需检查推送权限或分支是否已更新。"
            echo
            echo "Check the failed step: CONFLICT during merge requires resolving upstream changes together with this fork's customizations; validation failures require fixing the merged code; push failures require checking permissions or concurrent branch updates."
            echo
            echo "合并冲突请在本地解决并运行 npm run check 后推送，再重新运行本工作流。保留文件期限、清理任务和域名跳转等定制功能，避免用上游版本直接覆盖。"
            echo
            echo "Resolve conflicts locally, preserve retention, cleanup and domain customizations, run npm run check, push, and rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
